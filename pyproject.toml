[project]
name = "rqark-sandbox"
version = "0.1.0"
description = "Red Queen Ark Sandbox - docker workspace, file and shell tools, git tools and sandbox prompts for rqark agents"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
authors = [{ name = "RedQueenArk" }]
keywords = ["agent", "sandbox", "docker", "workspace", "tools"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "docker>=7.2.0",
    "rqark-app==0.13.1",
    "rqark-core==0.5.3",
]

[project.urls]
Homepage = "https://github.com/Red-Queen-Ark/rqark-sandbox"
Repository = "https://github.com/Red-Queen-Ark/rqark-sandbox"
Issues = "https://github.com/Red-Queen-Ark/rqark-sandbox/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rqark_sandbox"]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.14",
    "ty>=0.0.38",
]

[tool.ruff]
exclude = ["*.ipynb"]
line-length = 240
indent-width = 4
target-version = "py314"

[tool.ruff.format]
quote-style = 'single'
skip-magic-trailing-comma = true

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.ty.src]
exclude = ["tests/"]

[tool.ty.environment]
python-platform = "all"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = []
filterwarnings = ["default"]
